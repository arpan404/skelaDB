apiVersion: apps/v1
kind: Deployment
metadata:
  name: skela-proxy
spec:
  replicas: 2
  selector:
    matchLabels: { app: skela-proxy }
  template:
    metadata:
      labels: { app: skela-proxy }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: skela-proxy}
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: proxy
          image: skeladb/proxy:dev
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          ports: [{ containerPort: 6432 }, { containerPort: 9090, name: metrics }]
          env:
            - { name: SKELA_POOL_SIZE, value: "8" }
            - { name: SKELA_MAX_UPSTREAMS, value: "16" }
            - { name: SKELA_MAX_CLIENTS, value: "24" }
            - { name: SKELA_MAX_BUFFER_BYTES, value: "67108864" }
            - { name: SKELA_LISTEN, value: "0.0.0.0:6432" }
            - { name: SKELA_CANCEL_PEERS, value: "skela-proxy-peers:6432" }
            - { name: SKELA_METRICS_LISTEN, value: "0.0.0.0:9090" }
            - { name: SKELA_CONTROL_URL, value: http://skela-control:8080 }
            - { name: SKELA_API_TOKEN, valueFrom: { secretKeyRef: { name: skela-api, key: token } } }
          resources:
            requests: { cpu: "200m", memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 6432 }
---
apiVersion: v1
kind: Service
metadata:
  name: skela-proxy
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: { app: skela-proxy }
  ports: [{ port: 6432 }]
---
apiVersion: v1
kind: Service
metadata:
  name: skela-proxy-peers
spec:
  clusterIP: None
  selector: { app: skela-proxy }
  ports: [{ port: 6432 }]
