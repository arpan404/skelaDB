apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - workload-identity.yaml
patches:
  - target: { kind: Deployment, name: skela-control }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: SKELA_BACKUP_PROVIDER, value: gcs }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SKELA_BACKUP_BUCKET
          valueFrom: { configMapKeyRef: { name: skela-backup-config, key: bucket } }
  - target: { kind: Service, name: skela-proxy }
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          networking.gke.io/load-balancer-type: Internal
