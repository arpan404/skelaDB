apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skela
resources:
  - ../base
  - storageclass.yaml
patches:
  - target: { kind: Deployment, name: skela-control }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: SKELA_STORAGE_CLASS, value: skela-gp3 }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SKELA_BACKUP_BUCKET
          valueFrom: { configMapKeyRef: { name: skela-backup-config, key: bucket } }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SKELA_LICENSE_KEY
          valueFrom: { secretKeyRef: { name: skela-license, key: key, optional: true } }
  - target: { kind: Service, name: skela-proxy }
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
          service.beta.kubernetes.io/aws-load-balancer-scheme: internal
